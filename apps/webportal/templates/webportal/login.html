{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · CKC Attendance</title>
  <link rel="icon" href="{% static 'webportal/img/logo.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'webportal/css/portal.css' %}" rel="stylesheet">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-hero">
        <img src="{% static 'webportal/img/logo.png' %}" alt="CKC" onerror="this.style.display='none'">
        <h1>CKC Attendance</h1>
        <p>Admin Portal · Colegio de Kidapawan</p>
      </div>
      <div class="login-body">
        {% if messages %}
          {% for m in messages %}
            <div class="alert alert-{{ m.tags }} py-2 small rounded-3">{{ m }}</div>
          {% endfor %}
        {% endif %}
        <form method="post" action="{% url 'webportal:login' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-person text-muted"></i></span>
              <input name="username" class="form-control" autofocus required>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
              <input name="password" type="password" class="form-control" required>
            </div>
          </div>
          <button class="btn btn-brand w-100 py-2">Sign in</button>
        </form>
      </div>
    </div>
  </div>
  <script src="{% static 'webportal/js/portal.js' %}"></script>
</body>
</html>
