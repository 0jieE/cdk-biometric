<table id="dt-absences" class="table js-dt" data-dt-order='[[0,"desc"]]' style="width:100%">
  <thead><tr>
    <th>Date</th><th>Employee</th><th>Department</th><th>Session</th><th>Reason</th><th>Incomplete</th></tr></thead>
  <tbody>
  {% for a in rows %}
    <tr>
      <td data-order="{{ a.date|date:'Y-m-d' }}">{{ a.date|date:"M d, Y" }}</td>
      <td>{{ a.employee.full_name }} <span class="text-muted small">({{ a.employee.employee_no }})</span></td>
      <td>{{ a.employee.department.name }}</td>
      <td><span class="badge-status {% if a.session == 'FULL' %}s-absent{% else %}s-half{% endif %}">{{ a.session }}</span></td>
      <td>{{ a.get_reason_display }}</td>
      <td>{% if a.incomplete %}<i class="bi bi-exclamation-triangle-fill" style="color:var(--half)"></i> yes{% else %}—{% endif %}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
