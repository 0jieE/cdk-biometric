<div class="app-toast toast-success" role="status">
  <i class="bi bi-check-circle-fill toast-icon"></i>
  <div class="toast-body-text">
    <div class="toast-title">Synced{% if device %} {{ device.name }}{% endif %}</div>
    <div>Created <strong>{{ result.created }}</strong>, duplicates <strong>{{ result.duplicates }}</strong>,
      lates <strong>{{ result.lates }}</strong>, skipped <strong>{{ result.skipped }}</strong>
      over {{ result.dates_processed }} day(s).</div>
  </div>
  <button type="button" class="btn-close btn-close-sm" data-toast-close aria-label="Close"></button>
</div>
