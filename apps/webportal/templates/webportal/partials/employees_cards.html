<div class="d-flex align-items-center justify-content-between mb-2">
  <div class="text-muted small"><span id="emp-count">{{ rows|length }}</span> employee{{ rows|length|pluralize }}</div>
</div>

<div class="emp-grid">
  {% for e in rows %}
    {% include 'webportal/partials/employee_card.html' with e=e %}
  {% endfor %}
</div>

<div id="emp-empty" class="text-center text-muted py-5" style="display:none">
  <i class="bi bi-search" style="font-size:28px"></i>
  <div class="mt-2">No employees match your filters.</div>
</div>
