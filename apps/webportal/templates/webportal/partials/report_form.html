<form hx-post="{% url 'webportal:reports' %}" hx-target="#reportForm">
  {% csrf_token %}
  {% for field in form %}
    <div class="mb-2">
      <label class="form-label small">{{ field.label }}</label>
      {{ field }}
      {% if field.help_text %}<div class="form-text small">{{ field.help_text }}</div>{% endif %}
      {% if field.errors %}<div class="text-danger small">{{ field.errors|striptags }}</div>{% endif %}
    </div>
  {% endfor %}
  <button type="submit" class="btn btn-primary btn-sm w-100">
    <i class="bi bi-gear"></i> Generate</button>
</form>
