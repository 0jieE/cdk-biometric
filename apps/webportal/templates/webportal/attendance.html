{% extends 'webportal/base.html' %}
{% block title %}Attendance{% endblock %}
{% block heading %}Attendance Logs{% endblock %}
{% block content %}
<div class="card mb-3"><div class="card-pad">
  <form id="dt-filters" class="row g-2 align-items-end">
    <div class="col-6 col-md-2"><label class="form-label">Start</label>
      <input type="date" name="date_start" value="{{ filters.start|date:'Y-m-d' }}" class="form-control"></div>
    <div class="col-6 col-md-2"><label class="form-label">End</label>
      <input type="date" name="date_end" value="{{ filters.end|date:'Y-m-d' }}" class="form-control"></div>
    <div class="col-6 col-md-3"><label class="form-label">Department</label>
      <select name="department" class="form-select"><option value="">All</option>
        {% for d in departments %}<option value="{{ d.id }}" {% if filters.department == d.id|stringformat:'s' %}selected{% endif %}>{{ d.name }}</option>{% endfor %}
      </select></div>
    <div class="col-6 col-md-3"><label class="form-label">Employee</label>
      <select name="employee" class="form-select"><option value="">All</option>
        {% for e in employees %}<option value="{{ e.id }}" {% if filters.employee == e.id|stringformat:'s' %}selected{% endif %}>{{ e.full_name }}</option>{% endfor %}
      </select></div>
    <div class="col-6 col-md-2"><label class="form-label">Status</label>
      <select name="status" class="form-select"><option value="">All</option>
        {% for s in statuses %}<option value="{{ s }}" {% if filters.status == s %}selected{% endif %}>{{ s }}</option>{% endfor %}
      </select></div>
  </form>
</div></div>

<div class="card"><div class="card-pad">
  <ul class="nav nav-pills mb-3" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-ft" type="button">
      <i class="bi bi-person-badge"></i> Full-time</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-pt" type="button">
      <i class="bi bi-person"></i> Part-time</button></li>
  </ul>

  <div class="tab-content">
    <div class="tab-pane fade show active" id="tab-ft" role="tabpanel">
      <div class="table-responsive">
        <table id="dt-att-ft" class="table js-dt-server"
               data-dt-url="{% url 'webportal:attendance_data' %}?emp_type=FULL_TIME"
               data-dt-order='[[0,"desc"]]' style="width:100%">
          <thead><tr>
            <th>Date</th><th>Employee</th><th>AM In</th><th>AM Out</th><th>PM In</th><th>PM Out</th>
            <th>Day Status</th><th>Late (min)</th><th>Undertime (min)</th><th>Lost (min)</th>
            <th>OT (min)</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="tab-pane fade" id="tab-pt" role="tabpanel">
      <div class="table-responsive">
        <table id="dt-att-pt" class="table js-dt-server"
               data-dt-url="{% url 'webportal:attendance_data' %}?emp_type=PART_TIME"
               data-dt-order='[[0,"desc"]]' style="width:100%">
          <thead><tr>
            <th>Date</th><th>Employee</th><th>In</th><th>Out</th>
            <th>Day Status</th><th>Incomplete</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div></div>
<div>
  
</div>
{% endblock %}
