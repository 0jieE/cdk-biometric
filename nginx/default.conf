# Behind a tunnel (ngrok / cloudflared) the request reaches nginx over plain http,
# but the tunnel tells us the client used https via X-Forwarded-Proto. Keep that
# value when present instead of overwriting it with nginx's own $scheme — otherwise
# Django believes every tunneled request is http and builds http:// absolute URLs
# (e.g. photo URLs), which Android blocks as cleartext. Direct LAN access sends no
# such header, so it falls back to $scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # Room for report downloads / uploads.
    client_max_body_size 25M;

    # Resolve the backend via Docker's embedded DNS (127.0.0.11) at REQUEST time,
    # not at startup. Combined with the $upstream_web variable in proxy_pass, this
    # lets nginx boot even if `web` is momentarily down/unresolvable (avoids the
    # "host not found in upstream" crash on cold start / restarts).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Static files (collected into the shared static_volume by `collectstatic`).
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 7d;
    }

    # Media files (report exports written by the Celery worker).
    location /media/ {
        alias /app/media/;
        access_log off;
    }

    # Real-time live-log push (Server-Sent Events) — must not be buffered,
    # and stays open indefinitely while a kiosk tab is watching it.
    location /live/stream/ {
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Everything else -> Django (web:8000).
    location / {
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
    }
}

